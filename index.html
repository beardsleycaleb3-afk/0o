<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=350, height=500, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="0o">
  <title>0o</title>
  <style>
    body { margin:0; padding:0; overflow:hidden; background:#000; color:#0f0; font-family:monospace; touch-action:none; width:350px; height:500px; }
    #0o_Root { display:flex; flex-direction:column; width:350px; height:500px; position:relative; overflow:hidden; }
    #0o_Lattice { width:100%; height:100px; background:#080808; border-top:1px solid #0f0; image-rendering:pixelated; flex-shrink:0; }
    .0o_HUD { position:absolute; z-index:100; pointer-events:none; font-size:9px; text-transform:uppercase; }
    button { cursor:pointer; background:#000; color:#0f0; border:1px solid #0f0; padding:8px; font-family:monospace; font-size:10px; flex:1; text-transform:uppercase; }
    #0o_Overlay { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200; }
    canvas { display: block; }
  </style>
</head>
<body>
<div id="0o_Root">
  <div class="0o_HUD" style="top:12px; left:12px; border-left:2px solid #0f0; padding-left:8px;">
    <div>0o_CORE_OSC</div>
    <div id="v_val" style="font-size:20px; color:#fff;">0.0000</div>
    <div style="color:#ff00cc; font-size:8px;">Y-LOCK: 14.4</div>
  </div>

  <div id="0o_Viewport" style="flex-grow:1; background:#000; width:100%;"></div>
  <canvas id="0o_Lattice"></canvas>

  <div style="height:55px; background:#000; display:flex; padding:5px; gap:5px; border-top:1px solid #333; box-sizing:border-box;">
    <input type="file" id="0o_audio_in" accept="audio/*" style="display:none;">
    <button onclick="document.getElementById('0o_audio_in').click()">0o_LOAD</button>
    <button id="0o_play">0o_INIT</button>
  </div>

  <div id="0o_Overlay">
    <h1 style="color:#0f0; letter-spacing:15px; margin:0;">0o</h1>
    <p style="color:#333; font-size:8px; margin-bottom:20px;">v2009 | 018810 MIRROR</p>
    <button id="0o_start" style="flex:none; padding:15px 40px; border-width:2px;">ENGAGE</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'https://esm.sh/three@0.177.0';
  
  const POINTS = 8228;
  const Y_LOCK = 14.4;
  let scene, camera, renderer, mesh, aCtx, anal, dArray, isOn = false, src, buf;

  async function sync0o() {
    if(!aCtx) {
      aCtx = new (window.AudioContext || window.webkitAudioContext)();
      anal = aCtx.createAnalyser();
      anal.fftSize = 512;
      dArray = new Uint8Array(anal.frequencyBinCount);
    }
    if(aCtx.state === 'suspended') await aCtx.resume();
  }

  document.getElementById('0o_audio_in').onchange = async (e) => {
    await sync0o();
    buf = await aCtx.decodeAudioData(await e.target.files[0].arrayBuffer());
    document.getElementById('0o_play').textContent = "0o_READY";
  };

  document.getElementById('0o_play').onclick = () => {
    if(!buf) return;
    if(isOn) { src.stop(); isOn = false; document.getElementById('0o_play').textContent = "0o_START"; }
    else {
      src = aCtx.createBufferSource();
      src.buffer = buf;
      src.connect(anal);
      anal.connect(aCtx.destination);
      src.start(0);
      isOn = true;
      document.getElementById('0o_play').textContent = "0o_HALT";
    }
  };

  function init0o() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, 350 / 345, 0.1, 1000);
    camera.position.set(10, 10, 10);
    camera.lookAt(0,0,0);
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    renderer.setSize(350, 345);
    document.getElementById('0o_Viewport').appendChild(renderer.domElement);

    const geo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    mesh = new THREE.InstancedMesh(geo, mat, POINTS);
    scene.add(mesh);

    const dummy = new THREE.Object3D();
    for(let i=0; i<POINTS; i++) {
      dummy.position.set((i % 40) - 20, -2, Math.floor(i / 40) - 20);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }

    const lCanvas = document.getElementById('0o_Lattice');
    const lCtx = lCanvas.getContext('2d');
    lCanvas.width = 350;
    lCanvas.height = 100;

    function frame() {
      requestAnimationFrame(frame);
      if(isOn && anal) {
        anal.getByteFrequencyData(dArray);
        document.getElementById('v_val').textContent = (dArray[0]/255).toFixed(4);
        
        const d = new THREE.Object3D();
        for(let i=0; i<400; i++) {
          mesh.getMatrixAt(i, d.matrix);
          d.matrix.decompose(d.position, d.rotation, d.scale);
          d.scale.y = (dArray[i % dArray.length]/255) * Y_LOCK;
          d.updateMatrix();
          mesh.setMatrixAt(i, d.matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;

        lCtx.fillStyle = '#080808';
        lCtx.fillRect(0,0,350,100);
        lCtx.fillStyle = '#0f0';
        for(let j=0; j<350; j++) {
            let h = (dArray[j % dArray.length]/255) * 100;
            lCtx.fillRect(j, 100-h, 1, h);
        }
      }
      renderer.render(scene, camera);
    }
    frame();
  }

  document.getElementById('0o_start').onclick = () => {
    document.getElementById('0o_Overlay').style.display = 'none';
    init0o();
  };

  // --- SERVICE WORKER REGISTRATION AT ABSOLUTE BOTTOM ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(() => {
        console.log('0o_LOCKED');
      });
    });
  }
</script>
</body>
</html>
