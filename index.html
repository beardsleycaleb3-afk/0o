<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>0o Geometric Engine</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="0o-grid-container"></div>
    
    <div id="0o-status-line">> System Idle...</div>

    <canvas id="0o-canvas" style="display:none;"></canvas>

    <script type="module">
        // Import and Initialize Core Stack
        import { Kernel } from './modules/kernel.js';
        import { Manager } from './src/manager.js';
        import { Grid } from './src/grid.js';
        import { Canvas } from './src/canvas.js';
        import { Renderer } from './src/renderer.js';

        async function boot() {
            console.log("0o: Initializing Boot Sequence...");
            
            // 1. Initialize Hardware
            Kernel.init();
            
            // 2. Initialize UI & Rendering
            Grid.init('0o-grid-container');
            Canvas.init(document.getElementById('0o-canvas'));
            Renderer.init();
            
            // 3. Start Orchestration
            Manager.init();
            
            console.log("0o: Boot Sequence Complete.");
        }

        boot();

        // Step 28: Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('0o SW: Registered', reg))
                    .catch(err => console.error('0o SW: Failed', err));
            });
        }
    </script>
</body>
</html>
